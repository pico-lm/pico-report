[pytest]
# Pytest configuration for pico-report tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    integration: Integration tests that require a running API (run with -m integration)
    unit: Unit tests with mocked dependencies

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Test paths
testpaths = tests

# Ignore patterns
norecursedirs = .git .tox dist build *.egg .venv